<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrenar - BilboAG</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/svg+xml" href="/icons/logo.svg">
</head>
<body>

  <!-- Top Desktop Nav -->
  <header class="top-nav">
    <div class="top-nav-container">
      <a href="/" class="brand-link">
        <img src="/icons/logo.svg" alt="BilboAG Logo">
        <span class="brand-name">Bilbo<span style="color: var(--color-primary);">AG</span></span>
      </a>

      <nav class="desktop-nav-links">
        <a href="/" class="nav-item">Inicio</a>
        <a href="/training" class="nav-item active">Entrenar</a>
        <a href="/exercises" class="nav-item">Ejercicios</a>
        <a href="/history" class="nav-item">Historial</a>
        <a href="/admin/users" class="nav-item admin-only-link" style="display: none;">Admin</a>
      </nav>

      <div class="user-profile-menu">
        <span id="nav-username" class="text-muted" style="font-size: 0.875rem; font-weight: 600;"></span>
        <a href="/logout" class="btn btn-secondary btn-sm">Salir</a>
      </div>
    </div>
  </header>

  <!-- Main Training Container -->
  <main class="app-container fade-in">
    <!-- Header with Session Date Picker -->
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 20px;">
      <div>
        <h1 style="font-size: 1.5rem;">Registro de Entrenamiento</h1>
        <p class="text-muted" style="font-size: 0.875rem;">Añade tus series y controla tus marcas en tiempo real.</p>
      </div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <label for="session-date-picker" style="font-size: 0.8125rem; font-weight: 600;">Fecha:</label>
        <input type="date" id="session-date-picker" class="form-control" style="width: auto; padding: 6px 12px; font-size: 0.875rem;">
      </div>
    </div>

    <!-- Exercise Search & Selection Card -->
    <div class="card" style="margin-bottom: 20px;">
      <div class="card-header">
        <div class="card-title">
          <span>🔍</span>
          <span>Seleccionar Ejercicio</span>
        </div>
        <a href="/exercises" class="btn btn-outline btn-sm">+ Nuevo</a>
      </div>

      <div class="search-dropdown-wrapper">
        <input type="text" id="exercise-search-input" class="form-control" placeholder="Escribe para buscar (ej: banca, sentadilla, curl...)" autocomplete="off">
        <div id="exercise-search-dropdown" class="search-results-dropdown"></div>
      </div>

      <!-- Selected Exercise Info Box -->
      <div id="selected-exercise-card" style="display: none; margin-top: 16px; padding: 14px; background: var(--color-bg-secondary); border-radius: var(--radius-md); border: 1px solid var(--color-border);">
        <div style="display: flex; gap: 14px; align-items: center;">
          <div id="selected-exercise-media" style="flex-shrink: 0;"></div>
          <div style="flex: 1; min-width: 0;">
            <h3 id="selected-exercise-name" style="font-size: 1.0625rem; margin-bottom: 4px;"></h3>
            <span id="selected-exercise-badge" class="badge badge-primary"></span>
          </div>
        </div>

        <!-- Last 5 Sets of this exercise -->
        <div id="exercise-history-container" style="margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--color-border);"></div>
      </div>
    </div>

    <!-- Add Set Form Section (Shows when exercise is selected) -->
    <div id="set-inputs-section" class="card" style="display: none; border-left: 4px solid var(--color-primary);">
      <div class="card-header">
        <div class="card-title">
          <span>⚡</span>
          <span>Registrar Serie</span>
        </div>
        <div id="estimated-1rm-box" style="font-size: 0.875rem; font-weight: 600; color: var(--color-primary);">
          1RM Est.: <span id="estimated-1rm-val" style="font-size: 1.125rem; font-weight: 800;">-</span>
        </div>
      </div>

      <form id="add-set-form">
        <div class="grid-2">
          <!-- Weight Input -->
          <div class="form-group">
            <label for="set-weight" class="form-label">Peso utilizado (kg)</label>
            <input type="number" id="set-weight" name="weight" class="form-control" placeholder="0" min="0" max="999" step="0.5" value="0" required>
          </div>

          <!-- Reps Input (Default) -->
          <div id="reps-input-group" class="form-group">
            <label for="set-reps" class="form-label">Repeticiones realizadas</label>
            <input type="number" id="set-reps" name="reps" class="form-control" placeholder="ej: 8" min="1" max="200" step="1">
          </div>

          <!-- Time Input (Shown for isometric exercises) -->
          <div id="time-input-group" class="form-group" style="display: none;">
            <label class="form-label">Duración (Minutos y Segundos)</label>
            <div style="display: flex; gap: 8px;">
              <input type="number" id="set-time-min" class="form-control" placeholder="Min" min="0" max="60" value="0">
              <input type="number" id="set-time-sec" class="form-control" placeholder="Seg" min="0" max="59" value="30">
            </div>
          </div>
        </div>

        <!-- Notes Input -->
        <div class="form-group" style="margin-bottom: 20px;">
          <label for="set-notes" class="form-label">Notas u observaciones (opcional)</label>
          <input type="text" id="set-notes" name="notes" class="form-control" placeholder="ej: RPE 8, agarre ancho, fallo técnico en última rep">
        </div>

        <button type="submit" id="btn-submit-set" class="btn btn-primary btn-block btn-lg">
          ➕ Añadir Serie
        </button>
      </form>
    </div>

    <!-- Today's Workout Sets List -->
    <div>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
        <h2>📋 Series Registradas en la Sesión</h2>
      </div>
      <div id="today-sets-container">
        <div class="text-center text-muted" style="padding: 24px;">Cargando series...</div>
      </div>
    </div>
  </main>

  <!-- Mobile Bottom Navigation -->
  <nav class="bottom-nav">
    <a href="/" class="bottom-nav-item">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      <span>Inicio</span>
    </a>
    <a href="/training" class="bottom-nav-item active">
      <svg viewBox="0 0 24 24"><path d="M6 5v14M18 5v14M6 12h12M4 7h4M16 7h4M4 17h4M16 17h4"></path></svg>
      <span>Entrenar</span>
    </a>
    <a href="/history" class="bottom-nav-item">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
      <span>Historial</span>
    </a>
    <a href="/exercises" class="bottom-nav-item">
      <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
      <span>Ejercicios</span>
    </a>
  </nav>

  <script src="/js/training.js"></script>
  <script>
    // Check if query has ?exercise_id= to pre-select
    const urlParams = new URLSearchParams(window.location.search);
    const preExerciseId = urlParams.get('exercise_id');
    const preDate = urlParams.get('date');

    if (preDate) {
      const picker = document.getElementById('session-date-picker');
      if (picker) {
        picker.value = preDate;
        loadTodaySets();
      }
    }

    if (preExerciseId) {
      fetch(`/api/exercises?search=&limit=100`)
        .then(r => r.json())
        .then(data => {
          const found = (data.exercises || []).find(e => String(e.id) === String(preExerciseId));
          if (found) {
            selectExercise(found);
            document.getElementById('exercise-search-input').value = found.name;
          }
        })
        .catch(() => {});
    }

    // Nav user & role check
    fetch('/api/auth/me')
      .then(r => r.json())
      .then(d => {
        if (d.loggedIn && d.user) {
          const userEl = document.getElementById('nav-username');
          if (userEl) userEl.textContent = d.user.username;
          if (d.user.role === 'admin') {
            document.querySelectorAll('.admin-only-link').forEach(el => el.style.display = 'inline-flex');
          }
        }
      })
      .catch(() => {});
  </script>
</body>
</html>
