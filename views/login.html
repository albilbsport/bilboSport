<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - BilboAG</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/svg+xml" href="/icons/logo.svg">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 16px; background-color: var(--color-bg-secondary);">

  <div class="card fade-in" style="width: 100%; max-width: 400px; padding: 32px 24px; box-shadow: var(--color-card-shadow-hover);">
    <div class="text-center" style="margin-bottom: 24px;">
      <a href="/login" class="brand-link" style="justify-content: center; margin-bottom: 12px;">
        <img src="/icons/logo.svg" alt="BilboAG Logo" width="48" height="48">
        <span style="font-size: 1.5rem; font-weight: 800; color: var(--color-text);">Bilbo<span style="color: var(--color-primary);">AG</span></span>
      </a>
      <p class="text-muted" style="font-size: 0.875rem;">Seguimiento inteligente de fuerza y récords</p>
    </div>

    <!-- Alert Messages based on query params -->
    <div id="alert-box" style="display: none; margin-bottom: 16px; padding: 12px; border-radius: var(--radius-md); font-size: 0.875rem;"></div>

    <form action="/login" method="POST">
      <div class="form-group">
        <label for="login" class="form-label">Email o Usuario</label>
        <input type="text" id="login" name="login" class="form-control" placeholder="ej: admin@bilboag.local" required autofocus autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn-primary btn-block" style="margin-top: 20px;">
        Iniciar Sesión
      </button>
    </form>

    <div class="text-center" style="margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--color-border); font-size: 0.875rem;">
      <span class="text-muted">¿No tienes cuenta?</span>
      <a href="/register" style="font-weight: 600; margin-left: 4px;">Crear una cuenta</a>
    </div>
  </div>

  <script>
    // Handle query param messages
    const urlParams = new URLSearchParams(window.location.search);
    const alertBox = document.getElementById('alert-box');

    if (urlParams.get('success') === 'registered') {
      alertBox.style.display = 'block';
      alertBox.className = 'badge-success';
      alertBox.style.color = 'hsl(142, 70%, 25%)';
      alertBox.textContent = '¡Registro completado! Tu cuenta está pendiente de aprobación por el administrador.';
    } else if (urlParams.get('error') === 'pending') {
      alertBox.style.display = 'block';
      alertBox.className = 'badge-warning';
      alertBox.style.color = 'hsl(38, 92%, 25%)';
      alertBox.textContent = 'Tu cuenta aún está pendiente de aprobación por el administrador.';
    } else if (urlParams.get('error') === 'invalid_credentials') {
      alertBox.style.display = 'block';
      alertBox.className = 'badge-danger';
      alertBox.style.color = 'hsl(4, 86%, 35%)';
      alertBox.textContent = 'Usuario o contraseña incorrectos.';
    } else if (urlParams.get('error') === 'not_approved') {
      alertBox.style.display = 'block';
      alertBox.className = 'badge-warning';
      alertBox.style.color = 'hsl(38, 92%, 25%)';
      alertBox.textContent = 'Acceso bloqueado: cuenta pendiente de aprobación.';
    }
  </script>
</body>
</html>
