<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicios - BilboAG</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/svg+xml" href="/icons/logo.svg">
  <style>
    .filter-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .filter-tab {
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.8125rem;
      font-weight: 600;
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      color: var(--color-text-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: all var(--transition);
    }
    .filter-tab.active, .filter-tab:hover {
      background: var(--color-primary);
      color: #ffffff;
      border-color: var(--color-primary);
    }
  </style>
</head>
<body>

  <!-- Top Desktop Nav -->
  <header class="top-nav">
    <div class="top-nav-container">
      <a href="/" class="brand-link">
        <img src="/icons/logo.svg" alt="BilboAG Logo">
        <span class="brand-name">Bilbo<span style="color: var(--color-primary);">AG</span></span>
      </a>

      <nav class="desktop-nav-links">
        <a href="/" class="nav-item">Inicio</a>
        <a href="/training" class="nav-item">Entrenar</a>
        <a href="/exercises" class="nav-item active">Ejercicios</a>
        <a href="/history" class="nav-item">Historial</a>
        <a href="/admin/users" class="nav-item admin-only-link" style="display: none;">Admin</a>
      </nav>

      <div class="user-profile-menu">
        <span id="nav-username" class="text-muted" style="font-size: 0.875rem; font-weight: 600;"></span>
        <a href="/logout" class="btn btn-secondary btn-sm">Salir</a>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="app-container fade-in">
    <!-- Header with Action Button -->
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 20px;">
      <div>
        <h1 style="font-size: 1.5rem;">Catálogo de Ejercicios</h1>
        <p class="text-muted" style="font-size: 0.875rem;">Explora ejercicios globales o añade tus propias variantes.</p>
      </div>
      <button class="btn btn-primary" onclick="openCreateExerciseModal()">
        ➕ Añadir ejercicio personal
      </button>
    </div>

    <!-- Search & Filters -->
    <div class="card" style="padding: 16px; margin-bottom: 20px;">
      <div style="display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 12px;">
        <input type="text" id="exercises-search" class="form-control" placeholder="Buscar por nombre, músculo o equipamiento...">
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
        <!-- Filter Tabs -->
        <div class="filter-tabs" style="margin-bottom: 0;">
          <button class="filter-tab active" data-filter="all">Todos</button>
          <button class="filter-tab" data-filter="mine">Mis ejercicios</button>
          <button class="filter-tab" data-filter="global">Globales</button>
        </div>

        <!-- Body part dropdown -->
        <div style="display: flex; align-items: center; gap: 8px;">
          <label for="body-part-filter" style="font-size: 0.8125rem; font-weight: 600; color: var(--color-text-muted);">Músculo:</label>
          <select id="body-part-filter" class="form-control" style="width: auto; padding: 6px 12px; font-size: 0.8125rem;">
            <option value="">Todos los grupos</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Results count & grid -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
      <span id="exercises-count" class="text-muted" style="font-size: 0.875rem; font-weight: 600;">Cargando...</span>
    </div>

    <div id="exercises-grid" class="grid-2" style="gap: 16px;">
      <div class="skeleton" style="width: 100%; height: 120px;"></div>
      <div class="skeleton" style="width: 100%; height: 120px;"></div>
    </div>

    <!-- Pagination Controls -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 24px; padding: 12px 0;">
      <button id="pagination-prev" class="btn btn-secondary btn-sm" disabled>
        ← Anterior
      </button>
      <span id="pagination-info" class="text-muted" style="font-size: 0.875rem; font-weight: 600;">Página 1</span>
      <button id="pagination-next" class="btn btn-secondary btn-sm" disabled>
        Siguiente →
      </button>
    </div>
  </main>

  <!-- Create Exercise Modal -->
  <div id="modal-create-exercise" class="modal-backdrop">
    <div class="modal-content">
      <div class="modal-header">
        <h3 style="font-size: 1.125rem;">Añadir Ejercicio Personal</h3>
        <button class="modal-close-btn" onclick="closeCreateExerciseModal()">&times;</button>
      </div>
      <form id="add-exercise-form">
        <div class="modal-body">
          <div class="form-group">
            <label for="custom-name" class="form-label">Nombre del Ejercicio *</label>
            <input type="text" id="custom-name" name="name" class="form-control" placeholder="ej: Press Militar en Máquina Smith" required>
          </div>

          <div class="grid-2">
            <div class="form-group">
              <label for="custom-body-part" class="form-label">Grupo Muscular / Zona</label>
              <input type="text" id="custom-body-part" name="body_part" class="form-control" placeholder="ej: pecho, hombros, piernas">
            </div>
            <div class="form-group">
              <label for="custom-target" class="form-label">Músculo Objetivo</label>
              <input type="text" id="custom-target" name="target" class="form-control" placeholder="ej: deltoides anterior">
            </div>
          </div>

          <div class="grid-2">
            <div class="form-group">
              <label for="custom-equipment" class="form-label">Equipamiento</label>
              <input type="text" id="custom-equipment" name="equipment" class="form-control" placeholder="ej: mancuernas, barra, polea">
            </div>
            <div class="form-group">
              <label for="custom-category" class="form-label">Categoría</label>
              <input type="text" id="custom-category" name="category" class="form-control" placeholder="ej: hipertrofia, fuerza">
            </div>
          </div>

          <div class="form-group">
            <label for="custom-measure-type" class="form-label">Tipo de Medición *</label>
            <select id="custom-measure-type" name="measure_type" class="form-control">
              <option value="reps" selected>Por Repeticiones (peso + reps con cálculo 1RM)</option>
              <option value="time">Por Tiempo (peso + duración en segundos)</option>
            </select>
          </div>

          <div class="form-group">
            <label for="custom-instructions" class="form-label">Instrucciones o Notas Técnicas</label>
            <textarea id="custom-instructions" name="instructions_es" class="form-control" placeholder="Técnica, colocación, consejos..."></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeCreateExerciseModal()">Cancelar</button>
          <button type="submit" class="btn btn-primary">Guardar Ejercicio</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Mobile Bottom Navigation -->
  <nav class="bottom-nav">
    <a href="/" class="bottom-nav-item">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      <span>Inicio</span>
    </a>
    <a href="/training" class="bottom-nav-item">
      <svg viewBox="0 0 24 24"><path d="M6 5v14M18 5v14M6 12h12M4 7h4M16 7h4M4 17h4M16 17h4"></path></svg>
      <span>Entrenar</span>
    </a>
    <a href="/history" class="bottom-nav-item">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
      <span>Historial</span>
    </a>
    <a href="/exercises" class="bottom-nav-item active">
      <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
      <span>Ejercicios</span>
    </a>
  </nav>

  <script src="/js/exercises.js"></script>
  <script>
    // Nav user & role check
    fetch('/api/auth/me')
      .then(r => r.json())
      .then(d => {
        if (d.loggedIn && d.user) {
          const userEl = document.getElementById('nav-username');
          if (userEl) userEl.textContent = d.user.username;
          if (d.user.role === 'admin') {
            document.querySelectorAll('.admin-only-link').forEach(el => el.style.display = 'inline-flex');
          }
        }
      })
      .catch(() => {});
  </script>
</body>
</html>
