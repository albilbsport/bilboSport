<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="bilboGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="hsl(220, 90%, 60%)" />
      <stop offset="100%" stop-color="hsl(220, 90%, 45%)" />
    </linearGradient>
  </defs>
  <!-- Main Barbell Shaft -->
  <rect x="6" y="22" width="36" height="4" rx="2" fill="url(#bilboGrad)" />
  <!-- Center Knurling Grips -->
  <line x1="20" y1="21" x2="20" y2="27" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="24" y1="21" x2="24" y2="27" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="28" y1="21" x2="28" y2="27" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <!-- Left Weight Plates -->
  <rect x="11" y="11" width="4" height="26" rx="2" fill="url(#bilboGrad)" />
  <rect x="7" y="14" width="3" height="20" rx="1.5" fill="hsl(220, 90%, 45%)" />
  <rect x="15" y="19" width="2" height="10" rx="1" fill="hsl(220, 90%, 35%)" />
  <!-- Right Weight Plates -->
  <rect x="33" y="11" width="4" height="26" rx="2" fill="url(#bilboGrad)" />
  <rect x="38" y="14" width="3" height="20" rx="1.5" fill="hsl(220, 90%, 45%)" />
  <rect x="31" y="19" width="2" height="10" rx="1" fill="hsl(220, 90%, 35%)" />
</svg>
